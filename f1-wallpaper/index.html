<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Live Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * Animated F1 night-race wallpaper.
 * URL options (append to the file path / URL):
 *   ?color=red | orange | silver | blue | green | pink   (or any hex, e.g. color=%23ff0000)
 *   &number=16          car number on the nose/engine cover
 *   &speed=1            animation speed multiplier (0.5 = calmer, 2 = faster)
 *   &clock=1            show a clock in the corner
 */
const params = new URLSearchParams(location.search);
const PRESETS = {
  red: ['#d40000', '#ffd400'], orange: ['#ff8000', '#1e5bc6'], silver: ['#c8ccce', '#00d2be'],
  blue: ['#1e2a5a', '#e10600'], green: ['#00594f', '#cedc00'], pink: ['#ff5fa2', '#1a1a1a'],
};
const colorParam = params.get('color') || 'red';
const [BODY, ACCENT] = PRESETS[colorParam] || [colorParam, '#ffffff'];
const NUMBER = (params.get('number') || '16').slice(0, 2);
const SPEED = Math.max(0.1, parseFloat(params.get('speed')) || 1);
const SHOW_CLOCK = params.get('clock') === '1';

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildScene();
}

// ---------- scene data ----------
let stars = [], skyline = [], poles = [], streaks = [], sparks = [];
const rand = (a, b) => a + Math.random() * (b - a);

function buildScene() {
  stars = Array.from({ length: 140 }, () => ({ x: rand(0, W), y: rand(0, H * 0.45), r: rand(0.3, 1.4), p: rand(0, 6.28) }));
  skyline = [];
  for (let x = 0; x < W * 2 + 200;) {
    const w = rand(30, 90);
    skyline.push({ x, w, h: rand(H * 0.06, H * 0.22), win: Math.random() });
    x += w + rand(2, 12);
  }
  poles = Array.from({ length: 6 }, (_, i) => ({ x: (i * W) / 5 }));
  streaks = Array.from({ length: 50 }, () => newStreak(true));
}
function newStreak(anyX) {
  return { x: anyX ? rand(0, W) : W + rand(0, W * 0.5), y: rand(H * 0.35, H * 0.95), len: rand(60, 260), v: rand(1.4, 3), a: rand(0.08, 0.35) };
}

// ---------- drawing helpers ----------
const horizon = () => H * 0.58;
const roadTop = () => H * 0.68;

function drawSky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, horizon());
  g.addColorStop(0, '#04050c'); g.addColorStop(0.7, '#0c1030'); g.addColorStop(1, '#2a1640');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon());
  for (const s of stars) {
    ctx.globalAlpha = 0.4 + 0.4 * Math.sin(t * 0.002 + s.p);
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.28); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawSkyline(offset) {
  const base = horizon();
  const span = skyline[skyline.length - 1].x + 100;
  const o = offset % span;
  for (const b of skyline) {
    let x = b.x - o; if (x + b.w < 0) x += span; if (x > W) continue;
    ctx.fillStyle = '#0a0b1a';
    ctx.fillRect(x, base - b.h, b.w, b.h);
    // lit windows
    ctx.fillStyle = b.win > 0.5 ? 'rgba(255,200,120,0.35)' : 'rgba(120,180,255,0.25)';
    for (let wy = base - b.h + 8; wy < base - 6; wy += 10)
      for (let wx = x + 5; wx < x + b.w - 5; wx += 9)
        if (((wx * 7 + wy * 13) | 0) % 5 === 0) ctx.fillRect(wx, wy, 3, 4);
  }
  // horizon glow
  const g = ctx.createLinearGradient(0, base - 60, 0, base + 10);
  g.addColorStop(0, 'rgba(255,60,120,0)'); g.addColorStop(1, 'rgba(255,60,120,0.18)');
  ctx.fillStyle = g; ctx.fillRect(0, base - 60, W, 70);
}

function drawGround(offset) {
  const base = horizon(), rt = roadTop();
  // grass / runoff
  ctx.fillStyle = '#07120c'; ctx.fillRect(0, base, W, rt - base);
  // barrier with sponsor-free light strips
  ctx.fillStyle = '#12141f'; ctx.fillRect(0, rt - H * 0.05, W, H * 0.03);
  const seg = 120, o = offset * 0.9 % seg;
  for (let x = -o; x < W; x += seg) {
    ctx.fillStyle = 'rgba(0,210,255,0.55)'; ctx.fillRect(x, rt - H * 0.045, seg * 0.55, 3);
  }
  // asphalt
  const g = ctx.createLinearGradient(0, rt, 0, H);
  g.addColorStop(0, '#1b1c22'); g.addColorStop(1, '#0b0b0f');
  ctx.fillStyle = g; ctx.fillRect(0, rt, W, H - rt);
  // kerbs
  const kh = H * 0.018, kw = 70, ko = offset * 1.6 % (kw * 2);
  for (let x = -ko; x < W; x += kw) {
    ctx.fillStyle = (Math.round((x + ko) / kw) % 2) ? '#e8e8e8' : '#d10a1a';
    ctx.fillRect(x, rt, kw, kh);
  }
  // dashed track line
  const dy = H * 0.9, dl = 90, dO = offset * 1.6 % (dl * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (let x = -dO; x < W; x += dl * 2) ctx.fillRect(x, dy, dl, 3);
}

function drawPoles(dx) {
  const rt = roadTop();
  for (const p of poles) {
    p.x -= dx; if (p.x < -60) p.x += W + 120;
    ctx.fillStyle = '#20222e'; ctx.fillRect(p.x, H * 0.18, 5, rt - H * 0.2);
    ctx.fillRect(p.x - 30, H * 0.18, 65, 6);
    const g = ctx.createRadialGradient(p.x + 2, H * 0.19, 2, p.x + 2, H * 0.19, 160);
    g.addColorStop(0, 'rgba(255,245,220,0.35)'); g.addColorStop(1, 'rgba(255,245,220,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x + 2, H * 0.19, 160, 0, 6.28); ctx.fill();
  }
}

function drawStreaks(dt) {
  for (let i = 0; i < streaks.length; i++) {
    const s = streaks[i];
    s.x -= s.v * dt * SPEED * 1.4;
    if (s.x + s.len < 0) { streaks[i] = newStreak(false); continue; }
    const g = ctx.createLinearGradient(s.x, 0, s.x + s.len, 0);
    g.addColorStop(0, `rgba(255,255,255,${s.a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.fillRect(s.x, s.y, s.len, 1.5);
  }
}

// ---------- the car (side profile, nose to the right, ground at y=0) ----------
function wheel(cx, cy, r, rot) {
  ctx.fillStyle = '#0d0d0f'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.28); ctx.fill();
  ctx.strokeStyle = '#2a2a30'; ctx.lineWidth = r * 0.12; ctx.beginPath(); ctx.arc(cx, cy, r * 0.9, 0, 6.28); ctx.stroke();
  // tyre compound stripe
  ctx.strokeStyle = ACCENT; ctx.lineWidth = r * 0.05; ctx.beginPath(); ctx.arc(cx, cy, r * 0.72, 0, 6.28); ctx.stroke();
  // rim + spinning spokes
  ctx.fillStyle = '#3a3c44'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.6, 0, 6.28); ctx.fill();
  ctx.strokeStyle = 'rgba(200,205,215,0.55)'; ctx.lineWidth = r * 0.07;
  for (let k = 0; k < 6; k++) {
    const a = rot + k * Math.PI / 3;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * r * 0.58, cy + Math.sin(a) * r * 0.58); ctx.stroke();
  }
  // motion blur
  ctx.fillStyle = 'rgba(58,60,68,0.55)'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.6, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#c9ccd4'; ctx.beginPath(); ctx.arc(cx, cy, r * 0.12, 0, 6.28); ctx.fill();
}

function drawCar(t, rot) {
  const scale = Math.min(W * 0.5, H * 1.1) / 580;
  const groundY = roadTop() + (H - roadTop()) * 0.55;
  const bob = Math.sin(t * 0.03) * 0.6 + Math.sin(t * 0.071) * 0.4;
  const carX = W * 0.5 - 290 * scale + Math.sin(t * 0.0006) * W * 0.03;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.ellipse(carX + 290 * scale, groundY + 3, 300 * scale, 10 * scale, 0, 0, 6.28); ctx.fill();

  ctx.save();
  ctx.translate(carX, groundY + bob);
  ctx.scale(scale, scale);

  // rear wing
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.moveTo(-6, -130); ctx.lineTo(60, -130); ctx.lineTo(60, -104);
  ctx.lineTo(40, -60); ctx.lineTo(4, -60); ctx.lineTo(-6, -80); ctx.closePath(); ctx.fill();   // endplate
  ctx.fillStyle = BODY; ctx.fillRect(-6, -132, 70, 12);
  ctx.fillStyle = '#111'; ctx.fillRect(-2, -116, 60, 7);
  ctx.fillStyle = ACCENT; ctx.fillRect(-6, -132, 70, 3);

  // floor / plank
  ctx.fillStyle = '#0c0c10';
  ctx.beginPath(); ctx.moveTo(30, -12); ctx.lineTo(505, -12); ctx.lineTo(505, -20); ctx.lineTo(30, -22); ctx.closePath(); ctx.fill();

  // main body
  const g = ctx.createLinearGradient(0, -120, 0, -20);
  g.addColorStop(0, shade(BODY, 40)); g.addColorStop(0.5, BODY); g.addColorStop(1, shade(BODY, -60));
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(38, -30);
  ctx.lineTo(38, -62);
  ctx.bezierCurveTo(110, -70, 170, -100, 222, -120);   // engine cover up to airbox
  ctx.lineTo(240, -120);
  ctx.bezierCurveTo(248, -108, 250, -92, 256, -84);    // airbox rear of cockpit
  ctx.lineTo(318, -80);                                 // cockpit rim
  ctx.bezierCurveTo(380, -74, 470, -56, 548, -38);     // nose top
  ctx.lineTo(552, -30);
  ctx.bezierCurveTo(480, -30, 400, -34, 330, -36);     // nose underside
  ctx.lineTo(60, -24);
  ctx.closePath(); ctx.fill();

  // sidepod
  ctx.fillStyle = shade(BODY, -25);
  ctx.beginPath();
  ctx.moveTo(140, -28); ctx.bezierCurveTo(170, -66, 250, -70, 310, -62);
  ctx.lineTo(318, -40); ctx.bezierCurveTo(260, -34, 200, -28, 140, -28); ctx.fill();
  ctx.fillStyle = '#050507'; ctx.beginPath(); ctx.ellipse(312, -52, 5, 10, 0, 0, 6.28); ctx.fill();

  // livery stripes
  ctx.strokeStyle = ACCENT; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(60, -40); ctx.bezierCurveTo(200, -52, 360, -60, 545, -36); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(90, -64); ctx.bezierCurveTo(150, -80, 190, -98, 222, -112); ctx.stroke();

  // number
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px -apple-system, Helvetica, Arial, sans-serif';
  ctx.textAlign = 'center'; ctx.fillText(NUMBER, 170, -70);

  // driver helmet + halo
  ctx.fillStyle = ACCENT; ctx.beginPath(); ctx.arc(282, -92, 13, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#0a0a0d'; ctx.fillRect(282, -97, 13, 6);
  ctx.strokeStyle = '#18181c'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(258, -84); ctx.quadraticCurveTo(290, -116, 330, -80); ctx.stroke();

  // front wing
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.moveTo(470, -8); ctx.lineTo(585, -8); ctx.lineTo(585, -16); ctx.lineTo(480, -20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = BODY; ctx.fillRect(560, -38, 8, 32);
  ctx.fillStyle = ACCENT; ctx.fillRect(478, -14, 105, 3);

  // suspension arms
  ctx.strokeStyle = '#1b1b20'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(400, -52); ctx.lineTo(452, -38); ctx.moveTo(405, -36); ctx.lineTo(452, -34);
  ctx.moveTo(150, -40); ctx.lineTo(108, -42); ctx.stroke();

  // wheels
  wheel(108, -40, 40, rot);
  wheel(452, -36, 36, rot * 1.1);

  // blinking rain light
  if (Math.floor(t / 300) % 2 === 0) {
    const rg = ctx.createRadialGradient(6, -46, 1, 6, -46, 26);
    rg.addColorStop(0, 'rgba(255,40,40,1)'); rg.addColorStop(1, 'rgba(255,0,0,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(6, -46, 26, 0, 6.28); ctx.fill();
  }
  ctx.restore();

  // sparks from the plank
  if (Math.random() < 0.25 * SPEED) {
    for (let i = 0; i < 4; i++) sparks.push({
      x: carX + rand(80, 260) * scale, y: groundY - 2, vx: -rand(4, 11), vy: -rand(0.5, 3), life: 1,
    });
  }
}

function drawSparks(dt) {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 0.25 * dt; s.life -= 0.035 * dt;
    if (s.life <= 0 || s.y > H) { sparks.splice(i, 1); continue; }
    ctx.strokeStyle = `rgba(255,${160 + 80 * s.life | 0},60,${s.life})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 2, s.y - s.vy * 2); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
}

function drawClock() {
  const d = new Date();
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.textAlign = 'right';
  ctx.font = `600 ${Math.round(H * 0.07)}px -apple-system, Helvetica, Arial, sans-serif`;
  ctx.fillText(d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), W - 40, H * 0.12);
  ctx.font = `400 ${Math.round(H * 0.022)}px -apple-system, Helvetica, Arial, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }), W - 44, H * 0.16);
}

function shade(hex, amt) {
  const m = /^#?([\da-f]{6})$/i.exec(hex); if (!m) return hex;
  const n = parseInt(m[1], 16);
  const c = (v) => Math.max(0, Math.min(255, v + amt));
  return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`;
}

// ---------- loop ----------
let last = performance.now(), dist = 0, wheelRot = 0;
function frame(now) {
  const dt = Math.min(3, (now - last) / 16.67); last = now;
  const v = 9 * SPEED * dt;
  dist += v; wheelRot += 0.45 * SPEED * dt;

  drawSky(now);
  drawSkyline(dist * 0.12);
  drawGround(dist);
  drawPoles(v * 0.6);
  drawStreaks(dt * 6);
  drawCar(now, wheelRot);
  drawSparks(dt);
  if (SHOW_CLOCK) drawClock();

  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
